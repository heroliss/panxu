<!doctype html>
<html lang="zh-CN" data-theme="system" data-theme-preference="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#10151e">
  <title>盘序 · AI 磁盘清理助手</title>
  <script src="/app.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/icons.css">
  <link rel="stylesheet" href="/hierarchy.css">
  <link rel="stylesheet" href="/cleanup-tools.css">
  <link rel="stylesheet" href="/user-tools.css">
  <link rel="stylesheet" href="/orchestration-ui.css">
  <link rel="stylesheet" href="/file-workspace.css">
  <link rel="stylesheet" href="/recovery.css">
  <script src="/icons.js" defer></script>
  <script src="/stream-view.js" defer></script>
  <script src="/stream-channel.js" defer></script>
  <script src="/tasks.js" defer></script>
  <script src="/files.js" defer></script>
  <script src="/duplicates.js" defer></script>
  <script src="/specialist-links.js" defer></script>
  <script src="/cleanup-tools.js" defer></script>
  <script src="/user-tools.js" defer></script>
  <script src="/orchestration-ui.js" defer></script>
  <script src="/file-workspace.js" defer></script>
  <script src="/recovery.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#workspace">跳到工作区</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#overview"><span class="brand-symbol" aria-hidden="true">盘</span><span>盘序<small>AI 磁盘清理助手</small></span></a>
      <div class="workspace-caption">工作台</div>
      <nav id="navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg></span>首页</button>
        <button class="nav-item" data-view="current"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 9h6M9 13h6M9 17h4"/></svg></span>整理进度<span id="current-task-state" class="nav-task-state" hidden></span></button>
        <button class="nav-item" data-view="files"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 11h18"/></svg></span>文件清理<span id="files-count" class="nav-count" hidden>0</span></button>
        <button class="nav-item" data-view="recovery"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></span>已删除文件</button>
        <button class="nav-item" data-view="background"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11M12 13h5M12 16h5"/></svg></span>后台与软件</button>
        <button class="nav-item" data-view="history"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.5 7M3 5v6h6"/><path d="M12 7v5l3 2"/></svg></span>操作记录</button>
        <button class="nav-item" data-view="cleanup"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6 4-3 3 3-3 4-3-1-6 6 1 3-4 3-3-3 3-4 3 1 6-6Z"/></svg></span>清理工具</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="environment-label"><span class="status-dot"></span>本地运行</div>
        <button class="nav-item" data-view="model"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="m10 3-.6 2.2-1.8 1L5.4 6 3.5 9.2 5 11v2l-1.5 1.8L5.4 18l2.2-.2 1.8 1L10 21h4l.6-2.2 1.8-1 2.2.2 1.9-3.2L19 13v-2l1.5-1.8L18.6 6l-2.2.2-1.8-1L14 3Z"/><circle cx="12" cy="12" r="3"/></svg></span>设置</button>
      </div>
    </aside>
    <div class="app-body">
      <header class="topbar">
        <div class="topbar-location"><button id="navigation-back" class="navigation-back" type="button" hidden>返回</button><div class="breadcrumb">盘序 <span aria-hidden="true">/</span> <span id="breadcrumb-current">首页</span></div></div>
        <div class="topbar-tools"><span class="local-status"><span class="status-dot"></span>本地运行</span><button id="advanced-toggle" hidden aria-expanded="false">高级选项</button><button id="inspector-toggle" class="icon-button" aria-expanded="false" aria-controls="inspector" hidden>收起说明</button></div>
      </header>
      <div class="safety-banner"><span class="banner-mark" aria-hidden="true">i</span><p><strong>模拟模式：</strong>仅记录删除、关闭启动项等操作，不会实际改动文件或系统。</p></div>
      <div id="global-message" class="global-message" role="status" hidden></div>
      <div class="content-grid inspector-hidden" id="content-grid">
        <main id="workspace" tabindex="-1" aria-label="工作区"><div class="loading-state"><span class="spinner"></span><h1>正在查看你的电脑</h1><p>马上就好。</p></div></main>
        <aside id="inspector" class="inspector" aria-label="项目说明" hidden><div id="inspector-content"></div></aside>
      </div>
      <footer id="selection-bar" class="selection-bar" hidden aria-label="所选项目操作"><div><strong id="selection-count"></strong><span id="selection-size"></span><span id="hidden-selection" class="hidden-selection" hidden></span></div><div class="selection-actions"><button id="clear-selection" class="plain-button">取消选择</button><button id="preview-plan" class="button">分析所选</button><button id="execute-selected" class="button primary">执行所选</button></div></footer>
      <footer class="app-footer"><span>盘序</span><span id="connection-status">正在连接</span></footer>
    </div>
  </div>
  <aside id="developer-dock" class="developer-dock" aria-labelledby="developer-dock-heading" hidden>
    <header class="developer-dock-heading"><div><h2 id="developer-dock-heading">开发面板</h2><kbd>F12</kbd></div><button id="developer-dock-close" class="button small" type="button" aria-label="关闭开发面板">关闭</button></header>
    <div id="developer-dock-content" class="developer-dock-scroll"></div>
  </aside>
  <aside id="advanced-drawer" class="advanced-drawer" aria-labelledby="advanced-heading" hidden><div class="drawer-heading"><h2 id="advanced-heading">高级选项</h2><button id="advanced-close" class="icon-button" aria-label="关闭高级选项">关闭</button></div><label class="field-label" for="scan-limit">每次检查的项目上限</label><select id="scan-limit"><option value="1000">1,000 项</option><option value="4000" selected>4,000 项</option><option value="10000">10,000 项</option></select><p class="field-help">未检查完整的文件夹不会整组加入删除清单。</p><label class="check-line"><input id="show-evidence" type="checkbox">在详情里显示识别依据</label><hr><h3>选择范围</h3><p>文件页的“全选本页”只覆盖当前页，后台清单的全选只覆盖当前筛选结果。其他页面的分析选择会保留，分析不会自动授权删除或其他操作。</p><p>下载资料、个人文件和后台程序需要你自行决定。保护清单优先于所有建议。</p></aside>
  <dialog id="plan-dialog" aria-labelledby="plan-title"><div class="dialog-heading"><div><h2 id="plan-title">确认所选操作</h2></div><button id="plan-close" class="icon-button">关闭</button></div><div id="plan-content"></div><div class="dialog-actions"><button id="plan-cancel" class="button">返回调整</button><button id="plan-execute" class="button primary">确认操作</button></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
